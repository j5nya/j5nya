<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300">
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#d4d4d8"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect x="440" width="400" height="300" fill="url(#fade)"/></mask>
    <style>
      .sans{font-family:Geist,Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:"Geist Mono","JetBrains Mono",ui-monospace,Consolas,monospace}
      .jp{font-family:"Noto Serif JP","Yu Mincho","Hiragino Mincho ProN","MS Mincho",serif}
      .in{opacity:0;animation:in .8s ease forwards}
      @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    </style>
  </defs>

  <rect x="1" y="1" width="838" height="298" rx="14" fill="#fff" stroke="#e4e4e7"/>
  <rect x="440" y="2" width="397" height="296" rx="13" fill="url(#dots)" opacity=".9" mask="url(#m)"/>

  <g class="in">
    <rect x="48" y="48" width="92" height="26" rx="13" fill="#fff" stroke="#e4e4e7"/>
    <circle cx="64" cy="61" r="3.5" fill="#22c55e"/>
    <text x="76" y="65.5" class="mono" font-size="12" fill="#52525b">j5nya</text>
  </g>

  <g class="in" style="animation-delay:.1s">
    <text x="46" y="140" class="sans" font-size="58" font-weight="600" letter-spacing="-2" fill="#09090b">watanabe</text>
    <text x="48" y="176" class="sans" font-size="16" fill="#71717a">low-level · reverse engineering · game clients &amp; engines</text>
  </g>

  <g class="in" style="animation-delay:.2s">
    <g font-size="12" class="mono" fill="#18181b">
      <rect x="48"  y="216" width="40"  height="26" rx="6" fill="#f4f4f5"/><text x="58"  y="233">C#</text>
      <rect x="96"  y="216" width="52"  height="26" rx="6" fill="#f4f4f5"/><text x="106" y="233">Java</text>
      <rect x="156" y="216" width="32"  height="26" rx="6" fill="#f4f4f5"/><text x="166" y="233">C</text>
      <rect x="196" y="216" width="92"  height="26" rx="6" fill="#f4f4f5"/><text x="206" y="233">TypeScript</text>
      <rect x="296" y="216" width="52"  height="26" rx="6" fill="#f4f4f5"/><text x="306" y="233">Luau</text>
    </g>
  </g>

  <g class="in" style="animation-delay:.35s">
    <text class="jp" font-size="64" fill="#e4e4e7" writing-mode="tb" glyph-orientation-vertical="0" x="700" y="56" letter-spacing="10">渡辺</text>
    <g transform="rotate(-4 770 220)">
      <rect x="742" y="192" width="56" height="56" rx="8" fill="none" stroke="#c8372d" stroke-width="3"/>
      <text x="770" y="231" text-anchor="middle" class="jp" font-size="30" font-weight="700" fill="#c8372d">渡</text>
    </g>
  </g>
</svg>
